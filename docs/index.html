<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APRE10 Calculator | Impulse Physical Therapy</title>
<meta name="description" content="APRE10 autoregulated strength training calculator from Impulse Physical Therapy, Buffalo NY.">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<meta name="theme-color" content="#1FA055">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1FA055;
    --green-dark: #019444;
    --bright: #3FEA8A;
    --mint: #77E1A7;
    --ink: #0A0A0A;
    --ink-2: #1e293b;
    --paper: #F4F4F0;
    --muted: #7A7A75;
    --line: #e2e2dc;
    --red: #cf2e2e;
    --amber: #b7791f;
    --head: 'Alata', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--body); color: var(--ink); background: var(--paper);
    -webkit-font-smoothing: antialiased; line-height: 1.5;
  }
  body.embed { background: transparent; }
  h1, h2, h3, .head { font-family: var(--head); font-weight: 400; margin: 0; }
  button { font: inherit; cursor: pointer; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* Header */
  header.brand {
    background: var(--green); color: #fff;
    padding: 14px 20px; display: flex; align-items: center; gap: 14px;
  }
  header.brand img { width: 52px; height: 52px; }
  header.brand .t1 { font-family: var(--head); font-size: 1.25rem; line-height: 1.1; color: var(--ink); }
  header.brand .t2 { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: #fff; }
  header.brand nav { margin-left: auto; display: flex; gap: 6px; }
  .tab {
    background: transparent; color: var(--ink); border: 0; padding: 8px 12px;
    font-family: var(--head); font-size: .95rem; border-bottom: 2px solid transparent;
  }
  .tab[aria-selected="true"] { border-bottom-color: var(--ink); }

  main { max-width: 640px; margin: 0 auto; padding: 22px 16px 40px; }

  /* Stepper */
  .stepper { display: flex; align-items: center; margin: 4px 0 22px; }
  .dot {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: .8rem; font-weight: 700;
    background: #e4e4de; color: var(--muted); transition: background .2s, color .2s, box-shadow .2s;
  }
  .dot.done { background: var(--green); color: #fff; }
  .dot.active { background: var(--ink); color: var(--bright); box-shadow: 0 0 0 4px rgba(63,234,138,.35); }
  .bar { flex: 1; height: 3px; background: #e4e4de; }
  .bar.done { background: var(--green); }
  .step-caption { text-align: center; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: -12px 0 18px; }

  /* Cards */
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 6px;
    padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    animation: in .22s ease-out;
  }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } .dot { transition: none; } }
  .eyebrow {
    display: flex; align-items: center; gap: 10px;
    font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--green-dark); margin-bottom: 8px;
  }
  .eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--green); }
  .card h2 { font-size: 1.6rem; line-height: 1.15; margin-bottom: 8px; }
  .lead { color: #333; margin: 0 0 14px; }
  .big {
    font-family: var(--head); font-size: 3.4rem; line-height: 1; margin: 10px 0 4px; color: var(--ink);
  }
  .big small { font-size: 1.1rem; color: var(--muted); margin-left: 6px; }
  .reps-target { font-family: var(--head); font-size: 1.25rem; color: var(--green-dark); }
  .note {
    background: var(--paper); border-left: 3px solid var(--mint); padding: 10px 14px;
    font-size: .9rem; color: #333; margin-top: 16px; border-radius: 0 4px 4px 0;
  }
  .note.warn { border-left-color: var(--amber); }
  ul.plain { margin: 8px 0 0; padding-left: 18px; }
  ul.plain li { margin: 3px 0; }

  /* Forms */
  label.field { display: block; margin: 16px 0 0; font-weight: 600; font-size: .92rem; }
  label.field .hint { display: block; font-weight: 400; color: var(--muted); font-size: .82rem; }
  input[type=text], input[type=number] {
    width: 100%; margin-top: 6px; padding: 12px 14px; font-size: 1.05rem;
    border: 1.5px solid #cfcfc8; border-radius: 4px; background: #fff; color: var(--ink);
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--bright); outline-offset: 2px; }
  input.invalid { border-color: var(--red); }
  .err { color: var(--red); font-size: .85rem; margin-top: 6px; min-height: 1em; }
  .seg { display: flex; margin-top: 6px; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .seg button {
    flex: 1; padding: 11px 8px; border: 0; background: #fff; color: var(--ink);
    border-right: 1.5px solid var(--ink); font-size: .95rem;
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bright); }
  .seg button small { display: block; font-size: .72rem; opacity: .8; }

  /* Rep stepper input */
  .reps-input { display: flex; align-items: stretch; gap: 8px; margin-top: 8px; }
  .reps-input button {
    width: 58px; border: 1.5px solid var(--ink); background: #fff; border-radius: 4px; font-size: 1.6rem; line-height: 1;
  }
  .reps-input input { margin: 0; text-align: center; font-family: var(--head); font-size: 1.8rem; }

  /* Buttons */
  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn {
    flex: 1; padding: 15px 18px; border-radius: 3px; border: 1.5px solid var(--green);
    background: var(--green); color: #fff; font-size: .82rem; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; transition: background .15s;
  }
  .btn:hover { background: var(--green-dark); }
  .btn.secondary { background: #fff; color: var(--ink); border-color: #cfcfc8; flex: 0 0 auto; }
  .btn.secondary:hover { background: var(--paper); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }

  /* Preview / results */
  .preview { margin-top: 12px; font-size: .95rem; min-height: 1.5em; }
  .pos { color: var(--green-dark); font-weight: 700; }
  .neg { color: var(--red); font-weight: 700; }
  .neu { color: var(--muted); font-weight: 700; }
  table.sum { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: .95rem; }
  table.sum th, table.sum td { text-align: left; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  table.sum th { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  table.sum td:last-child, table.sum th:last-child { text-align: right; }
  .result-hero { background: var(--ink); color: #fff; border-radius: 6px; padding: 22px; margin: 14px 0 4px; }
  .result-hero .big { color: var(--bright); }
  .result-hero .big small { color: #bbb; }
  .result-hero .lbl { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--mint); }

  /* Rest timer */
  .timer {
    display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 12px 14px;
    border: 1px dashed #cfcfc8; border-radius: 4px;
  }
  .timer .clock { font-family: var(--head); font-size: 1.6rem; min-width: 70px; }
  .timer .clock.done { color: var(--green-dark); }
  .timer button { padding: 8px 12px; border: 1.5px solid var(--ink); background: #fff; border-radius: 3px; font-size: .8rem; }

  /* Tables in About */
  table.ref { width: 100%; border-collapse: collapse; margin: 10px 0 4px; font-size: .92rem; }
  table.ref th, table.ref td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
  table.ref th { background: var(--paper); font-weight: 600; }

  /* History */
  .hist-item { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .hist-item .ex { font-weight: 600; }
  .hist-item .meta { font-size: .82rem; color: var(--muted); }
  .hist-item .w { font-family: var(--head); font-size: 1.2rem; text-align: right; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  svg.chart { width: 100%; height: 160px; display: block; margin: 8px 0 4px; }
  select { width: 100%; padding: 10px; font-size: 1rem; border: 1.5px solid #cfcfc8; border-radius: 4px; background: #fff; margin-top: 6px; }

  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 16px 28px; }
  footer a { color: var(--green-dark); }

  @media (max-width: 480px) {
    header.brand { flex-wrap: wrap; padding: 12px 14px; }
    header.brand img { width: 44px; height: 44px; }
    header.brand nav { width: 100%; margin-left: 0; justify-content: space-between; }
    .card { padding: 20px 16px; }
    .big { font-size: 2.9rem; }
    .card h2 { font-size: 1.4rem; }
  }
  @media print {
    header.brand nav, .actions, .stepper, .step-caption, .timer, footer .nolink { display: none !important; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<header class="brand">
  <img src="assets/logo.png" alt="Impulse Physical Therapy logo" width="52" height="52">
  <div>
    <div class="t1">APRE10 Calculator</div>
    <div class="t2">Impulse Physical Therapy</div>
  </div>
  <nav role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-view="calc" aria-selected="true">Workout</button>
    <button class="tab" role="tab" data-view="history" aria-selected="false">History</button>
    <button class="tab" role="tab" data-view="about" aria-selected="false">How it works</button>
  </nav>
</header>

<main id="app" aria-live="polite"></main>

<footer>
  Use this tool as directed by your physical therapist. Stop any set if you feel sharp pain or your form breaks down.<br>
  <span class="nolink">Questions? Call <a href="tel:7163543212">716-354-3212</a> &middot; <a href="https://impulseptwny.com" target="_top">impulseptwny.com</a></span>
</footer>

<script>
(() => {
  'use strict';

  /* ---------- APRE10 protocol ----------
     Set 1: 12 reps @ 50% of 10RM
     Set 2: 10 reps @ 75% of 10RM
     Set 3: max reps @ 100% of 10RM  -> reps set the Set 4 weight
     Set 4: max reps @ adjusted wt   -> reps set next session's 10RM
     Adjustments are a percentage of the current weight. "step" is 5 or 10. */
  const TIERS = [
    { min: 0,  max: 6,        mult: -1,   label: '0 to 6' },
    { min: 7,  max: 8,        mult: -0.5, label: '7 or 8' },
    { min: 9,  max: 11,       mult: 0,    label: '9 to 11' },
    { min: 12, max: 16,       mult: 1,    label: '12 to 16' },
    { min: 17, max: Infinity, mult: 1.5,  label: '17 or more' }
  ];
  const tierFor = reps => TIERS.find(t => reps >= t.min && reps <= t.max);
  const roundTo = (w, inc) => Math.round(w / inc) * inc;
  const fmt = n => (Math.round(n * 100) / 100).toString();

  function adjust(weight, reps, step, inc) {
    const pct = tierFor(reps).mult * step;
    let next = roundTo(weight * (1 + pct / 100), inc);
    // Guarantee a visible change when the protocol calls for one, even on light loads.
    if (pct > 0 && next <= weight) next = weight + inc;
    if (pct < 0 && next >= weight) next = weight - inc;
    next = Math.max(inc, next);
    return { weight: next, pct };
  }

  function plan(s) {
    return {
      set1: Math.max(s.inc, roundTo(s.rm * 0.5, s.inc)),
      set2: Math.max(s.inc, roundTo(s.rm * 0.75, s.inc)),
      set3: s.rm
    };
  }

  /* ---------- State (persisted so a refresh mid-workout is safe) ---------- */
  const KEY = 'impulse-apre10-session';
  const HKEY = 'impulse-apre10-history';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const fresh = () => ({ step: 0, exercise: '', unit: 'lb', rm: null, pct: 5, inc: 5, r1: 12, r2: 10, r3: null, r4: null, saved: false });
  let S = Object.assign(fresh(), store.get(KEY, {}));
  let view = 'calc';
  const save = () => store.set(KEY, S);

  const STEPS = ['Setup', 'Set 1', 'Set 2', 'Set 3', 'Set 4', 'Results'];
  const app = document.getElementById('app');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const unitInc = u => (u === 'kg' ? [1, 2.5] : [2.5, 5]);

  /* ---------- Rest timer ---------- */
  let timerId = null, timerEnd = 0;
  function stopTimer() { clearInterval(timerId); timerId = null; }
  function timerHTML(sec) {
    return `<div class="timer" data-sec="${sec}">
      <span class="clock" aria-live="off">${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}</span>
      <span style="flex:1;font-size:.85rem;color:var(--muted)">Rest timer</span>
      <button type="button" data-act="timer">Start</button></div>`;
  }
  function runTimer(box) {
    const clock = box.querySelector('.clock'), btn = box.querySelector('button');
    if (timerId) { stopTimer(); btn.textContent = 'Start'; return; }
    timerEnd = Date.now() + Number(box.dataset.sec) * 1000;
    btn.textContent = 'Stop'; clock.classList.remove('done');
    const tick = () => {
      const left = Math.max(0, Math.round((timerEnd - Date.now()) / 1000));
      clock.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
      if (!left) {
        stopTimer(); clock.textContent = 'Go!'; clock.classList.add('done'); btn.textContent = 'Start';
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }
    };
    tick(); timerId = setInterval(tick, 250);
  }

  /* ---------- Views ---------- */
  function stepper() {
    let h = '<div class="stepper" aria-hidden="true">';
    STEPS.forEach((_, i) => {
      const cls = i < S.step ? 'done' : i === S.step ? 'active' : '';
      h += `<div class="dot ${cls}">${i < S.step ? '&#10003;' : i + 1}</div>`;
      if (i < STEPS.length - 1) h += `<div class="bar ${i < S.step ? 'done' : ''}"></div>`;
    });
    return h + `</div><div class="step-caption">Step ${S.step + 1} of ${STEPS.length}: ${STEPS[S.step]}</div>`;
  }

  const seg = (name, opts, cur) => `<div class="seg" role="group">${opts.map(o =>
    `<button type="button" data-seg="${name}" data-val="${o.v}" aria-pressed="${String(o.v) === String(cur)}">${o.l}${o.s ? `<small>${o.s}</small>` : ''}</button>`).join('')}</div>`;

  const repsInput = (id, val) => `<div class="reps-input">
      <button type="button" data-bump="${id}" data-d="-1" aria-label="One less rep">&minus;</button>
      <input id="${id}" type="number" inputmode="numeric" min="0" max="60" step="1" value="${val ?? ''}" placeholder="0" aria-label="Reps completed">
      <button type="button" data-bump="${id}" data-d="1" aria-label="One more rep">+</button></div>`;

  function chip(pct) {
    const cls = pct > 0 ? 'pos' : pct < 0 ? 'neg' : 'neu';
    const txt = pct > 0 ? `+${fmt(pct)}%` : pct < 0 ? `${fmt(pct)}%` : 'no change';
    return `<span class="${cls}">(${txt})</span>`;
  }

  function vSetup() {
    const incs = unitInc(S.unit);
    return `<div class="card">
      <div class="eyebrow">Let's get set up</div>
      <h2>Start your APRE10 workout</h2>
      <p class="lead">This guide walks you through 4 sets. Your effort on the last two sets decides how much you lift next time.</p>

      <label class="field" for="ex">Exercise<span class="hint">For example: goblet squat, leg press, bench press</span></label>
      <input id="ex" type="text" maxlength="60" value="${esc(S.exercise)}" autocomplete="off">

      <div class="field" style="margin-top:16px;font-weight:600;font-size:.92rem">Units</div>
      ${seg('unit', [{ v: 'lb', l: 'Pounds' }, { v: 'kg', l: 'Kilograms' }], S.unit)}

      <label class="field" for="rm">Your current 10-rep weight (10RM)<span class="hint">The heaviest weight you can lift 10 times with good form. Your PT can help you find this.</span></label>
      <input id="rm" type="number" inputmode="decimal" min="1" step="any" value="${S.rm ?? ''}" placeholder="${S.unit === 'kg' ? 'e.g. 40' : 'e.g. 95'}">
      <div class="err" id="rm-err"></div>

      <div class="field" style="margin-top:16px;font-weight:600;font-size:.92rem">Adjustment size<span class="hint" style="display:block;font-weight:400;color:var(--muted);font-size:.82rem">How much the weight changes based on your reps. Use the one your PT chose for you.</span></div>
      ${seg('pct', [{ v: 5, l: '5%', s: 'Gradual' }, { v: 10, l: '10%', s: 'Faster' }], S.pct)}

      <div class="field" style="margin-top:16px;font-weight:600;font-size:.92rem">Round weights to the nearest</div>
      ${seg('inc', incs.map(v => ({ v, l: `${v} ${S.unit}` })), S.inc)}

      <div class="preview" id="setup-preview"></div>
      <div class="actions"><button class="btn" data-act="start">Start workout</button></div>
    </div>`;
  }

  function vSet(n) {
    const p = plan(S);
    const cfg = {
      1: { w: p.set1, tag: 'Warm-up', target: '12 reps', rest: 120, reps: 'r1',
           body: 'Light and controlled. This gets your muscles and joints ready. Do not push to failure.' },
      2: { w: p.set2, tag: 'Warm-up', target: '10 reps', rest: 120, reps: 'r2',
           body: 'A little heavier. Keep a smooth, steady pace with good form.' },
      3: { w: p.set3, tag: 'Working set', target: 'As many reps as you can', rest: 180, reps: 'r3',
           body: 'Do as many good-form reps as you can. Stop when your form starts to slip or you could not do one more clean rep.' },
      4: { w: adjust(p.set3, S.r3 ?? 10, S.pct, S.inc).weight, tag: 'Final working set', target: 'As many reps as you can', rest: 0, reps: 'r4',
           body: 'Same idea: as many good-form reps as you can. This set sets your weight for next time.' }
    }[n];
    const amrap = n >= 3;
    let adjLine = '';
    if (n === 4) adjLine = `<div class="note">Based on your ${S.r3} reps on Set 3, your weight changed ${chip(adjust(p.set3, S.r3, S.pct, S.inc).pct)}.</div>`;
    return `<div class="card">
      <div class="eyebrow">Set ${n} of 4 &middot; ${cfg.tag}</div>
      <h2>${esc(S.exercise || 'Your exercise')}</h2>
      <div class="big">${fmt(cfg.w)}<small>${S.unit}</small></div>
      <div class="reps-target">${cfg.target}</div>
      <p class="lead" style="margin-top:10px">${cfg.body}</p>
      ${adjLine}
      ${amrap ? '<div class="note warn">Stop right away if you feel sharp or increasing pain.</div>' : ''}
      <label class="field" for="reps">How many reps did you complete?</label>
      ${repsInput('reps', S[cfg.reps])}
      <div class="err" id="reps-err"></div>
      <div class="preview" id="reps-preview"></div>
      ${cfg.rest ? timerHTML(cfg.rest) : ''}
      <div class="actions">
        <button class="btn secondary" data-act="back">Back</button>
        <button class="btn" data-act="next">${n < 4 ? `Next: Set ${n + 1}` : 'See my results'}</button>
      </div>
    </div>`;
  }

  function vResults() {
    const p = plan(S);
    const a4 = adjust(p.set3, S.r3, S.pct, S.inc);
    const nx = adjust(a4.weight, S.r4, S.pct, S.inc);
    const rows = [
      ['Set 1 (warm-up)', p.set1, S.r1],
      ['Set 2 (warm-up)', p.set2, S.r2],
      ['Set 3 (max reps)', p.set3, S.r3],
      ['Set 4 (max reps)', a4.weight, S.r4]
    ];
    return `<div class="card">
      <div class="eyebrow">Workout complete</div>
      <h2>Nice work on ${esc(S.exercise || 'your exercise')}!</h2>
      <div class="result-hero">
        <div class="lbl">Your next 10RM weight</div>
        <div class="big">${fmt(nx.weight)}<small>${S.unit}</small></div>
        <div style="font-size:.9rem;color:#ddd">${S.r4} reps on Set 4 ${chip(nx.pct).replace('class="neu"', 'style="color:#bbb"')} from ${fmt(a4.weight)} ${S.unit}. Start Set 3 here next time.</div>
      </div>
      <table class="sum"><thead><tr><th>Set</th><th>Weight</th><th>Reps</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${r[0]}</td><td>${fmt(r[1])} ${S.unit}</td><td>${r[2]}</td></tr>`).join('')}
      </tbody></table>
      <p style="font-size:.82rem;color:var(--muted);margin:10px 0 0">Adjustment size: ${S.pct}% &middot; ${new Date().toLocaleDateString()}</p>
      <div class="actions">
        <button class="btn" data-act="save" ${S.saved ? 'disabled' : ''}>${S.saved ? 'Saved' : 'Save to history'}</button>
        <button class="btn ghost" data-act="new">New workout</button>
      </div>
      <div class="actions" style="margin-top:10px">
        <button class="btn secondary" style="flex:1" data-act="back">Edit Set 4</button>
        <button class="btn secondary" style="flex:1" data-act="print">Print</button>
      </div>
    </div>`;
  }

  function vHistory() {
    const h = store.get(HKEY, []);
    if (!h.length) return `<div class="card"><div class="eyebrow">History</div><h2>Your progress</h2>
      <div class="empty">No workouts saved yet.<br>Finish a workout and tap <b>Save to history</b>.<br><small>History is stored only on this device.</small></div></div>`;
    const exs = [...new Set(h.map(x => x.exercise))];
    const sel = window.__histEx && exs.includes(window.__histEx) ? window.__histEx : exs[0];
    const pts = h.filter(x => x.exercise === sel);
    return `<div class="card"><div class="eyebrow">History</div><h2>Your progress</h2>
      <label class="field" for="hist-ex">Exercise</label>
      <select id="hist-ex">${exs.map(e => `<option ${e === sel ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>
      ${chart(pts)}
      ${pts.slice().reverse().map(x => `<div class="hist-item"><div><div class="ex">${esc(x.exercise)}</div>
        <div class="meta">${esc(x.date)} &middot; Set 3: ${fmt(x.set3)} &times; ${x.r3} &middot; Set 4: ${fmt(x.set4)} &times; ${x.r4}</div></div>
        <div class="w">${fmt(x.next)} ${x.unit}<div class="meta">next 10RM</div></div></div>`).join('')}
      <div class="actions"><button class="btn secondary" style="flex:1" data-act="clear">Clear history</button></div>
      <p style="font-size:.8rem;color:var(--muted);text-align:center">History is stored only on this device and browser.</p></div>`;
  }

  function chart(pts) {
    if (pts.length < 2) return '<p style="font-size:.85rem;color:var(--muted)">Save 2 or more workouts for this exercise to see a progress chart.</p>';
    const W = 600, H = 160, P = 24, ys = pts.map(p => p.next);
    const lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
    const x = i => P + i * (W - 2 * P) / (pts.length - 1);
    const y = v => H - P - (v - lo) / span * (H - 2 * P);
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.next).toFixed(1)}`).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="10RM trend from ${fmt(ys[0])} to ${fmt(ys[ys.length - 1])} ${pts[0].unit}">
      <path d="${d}" fill="none" stroke="#1FA055" stroke-width="3" vector-effect="non-scaling-stroke"/>
      ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.next)}" r="5" fill="#0A0A0A"/>`).join('')}
      <text x="${P}" y="14" font-size="12" fill="#7A7A75">${fmt(hi)} ${pts[0].unit}</text>
      <text x="${P}" y="${H - 4}" font-size="12" fill="#7A7A75">${fmt(lo)} ${pts[0].unit}</text></svg>`;
  }

  function vAbout() {
    const r = (m, s) => { const v = m * s; return v > 0 ? `+${fmt(v)}%` : v < 0 ? `${fmt(v)}%` : 'No change'; };
    return `<div class="card"><div class="eyebrow">How it works</div><h2>What is APRE10?</h2>
      <p class="lead">APRE stands for Autoregulating Progressive Resistance Exercise. Instead of following a fixed plan, your weights adjust to how strong you are <em>that day</em>. Good day, the weight goes up. Tired or sore, it comes down. "10" means it is built around the weight you can lift 10 times (your 10RM).</p>
      <h3 style="margin-top:18px">Each workout</h3>
      <table class="ref"><thead><tr><th>Set</th><th>Weight</th><th>Reps</th></tr></thead><tbody>
        <tr><td>1</td><td>50% of 10RM</td><td>12</td></tr>
        <tr><td>2</td><td>75% of 10RM</td><td>10</td></tr>
        <tr><td>3</td><td>100% of 10RM</td><td>As many as possible</td></tr>
        <tr><td>4</td><td>Adjusted from Set 3</td><td>As many as possible</td></tr></tbody></table>
      <p style="font-size:.9rem">Your Set 3 reps set the Set 4 weight. Your Set 4 reps set next workout's 10RM.</p>
      <h3 style="margin-top:18px">Adjustment table</h3>
      <table class="ref"><thead><tr><th>Reps done</th><th>5% setting</th><th>10% setting</th></tr></thead><tbody>
        ${TIERS.map(t => `<tr><td>${t.label}</td><td>${r(t.mult, 5)}</td><td>${r(t.mult, 10)}</td></tr>`).join('')}</tbody></table>
      <p style="font-size:.85rem;color:var(--muted)">Weights are rounded to your chosen increment. If rounding would cancel out a change, the weight still moves by one increment.</p>
      <h3 style="margin-top:18px">Tips</h3>
      <ul class="plain">
        <li>Rest about 2 minutes after warm-ups and 3 minutes before Set 4.</li>
        <li>Only count reps done with good form.</li>
        <li>Stop if you feel sharp or increasing pain and let your PT know.</li>
      </ul>
      <p style="font-size:.8rem;color:var(--muted);margin-top:16px">Based on Mann JB et al. (2010), J Strength Cond Res 24(7):1718-1723, and Knight KL (1979), Med Sci Sports 11(4):336-340.</p>
    </div>`;
  }

  /* ---------- Render & events ---------- */
  function render() {
    stopTimer();
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === view)));
    if (view === 'history') app.innerHTML = vHistory();
    else if (view === 'about') app.innerHTML = vAbout();
    else app.innerHTML = stepper() + (S.step === 0 ? vSetup() : S.step === 5 ? vResults() : vSet(S.step));
    afterRender();
    notifyHeight();
  }

  function afterRender() {
    const rm = document.getElementById('rm');
    if (rm) {
      const ex = document.getElementById('ex');
      const upd = () => {
        S.exercise = ex.value; const v = parseFloat(rm.value); S.rm = v > 0 ? v : null; save();
        const pv = document.getElementById('setup-preview');
        if (S.rm) { const p = plan(S); pv.innerHTML = `Warm-ups: <b>${fmt(p.set1)} ${S.unit}</b> then <b>${fmt(p.set2)} ${S.unit}</b>. Working sets start at <b>${fmt(S.rm)} ${S.unit}</b>.`; }
        else pv.textContent = '';
      };
      ex.addEventListener('input', upd); rm.addEventListener('input', upd); upd();
    }
    const reps = document.getElementById('reps');
    if (reps) {
      const key = ['', 'r1', 'r2', 'r3', 'r4'][S.step];
      const upd = () => {
        const v = parseInt(reps.value, 10);
        S[key] = Number.isFinite(v) && v >= 0 ? Math.min(v, 60) : null; save();
        const pv = document.getElementById('reps-preview');
        if (S.step >= 3 && S[key] != null) {
          const base = S.step === 3 ? plan(S).set3 : adjust(plan(S).set3, S.r3, S.pct, S.inc).weight;
          const a = adjust(base, S[key], S.pct, S.inc);
          pv.innerHTML = `${S.step === 3 ? 'Set 4' : 'Next workout'} weight: <b>${fmt(a.weight)} ${S.unit}</b> ${chip(a.pct)}`;
        } else pv.textContent = '';
        reps.classList.remove('invalid'); document.getElementById('reps-err').textContent = '';
      };
      reps.addEventListener('input', upd); upd();
      reps.addEventListener('keydown', e => { if (e.key === 'Enter') app.querySelector('[data-act="next"]').click(); });
    }
    const hs = document.getElementById('hist-ex');
    if (hs) hs.addEventListener('change', () => { window.__histEx = hs.value; render(); });
  }

  function go(step) { S.step = step; save(); render(); window.scrollTo({ top: 0 }); scrollParent(); }

  app.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.seg) {
      const k = b.dataset.seg, v = b.dataset.val;
      S[k] = k === 'unit' ? v : Number(v);
      if (k === 'unit') S.inc = unitInc(v)[1];
      save(); render(); return;
    }
    if (b.dataset.bump) {
      const inp = document.getElementById(b.dataset.bump);
      inp.value = Math.max(0, Math.min(60, (parseInt(inp.value, 10) || 0) + Number(b.dataset.d)));
      inp.dispatchEvent(new Event('input')); return;
    }
    const act = b.dataset.act;
    if (act === 'timer') return runTimer(b.closest('.timer'));
    if (act === 'start') {
      if (!S.rm) { const rm = document.getElementById('rm'); rm.classList.add('invalid'); document.getElementById('rm-err').textContent = 'Enter your 10-rep weight to continue.'; rm.focus(); return; }
      S.exercise = S.exercise.trim(); S.saved = false; return go(1);
    }
    if (act === 'back') return go(S.step - 1);
    if (act === 'next') {
      const key = ['', 'r1', 'r2', 'r3', 'r4'][S.step];
      if (S[key] == null) { const r = document.getElementById('reps'); r.classList.add('invalid'); document.getElementById('reps-err').textContent = 'Enter the number of reps you completed.'; r.focus(); return; }
      if (S.step === 4) S.saved = false;
      return go(S.step + 1);
    }
    if (act === 'save') {
      const p = plan(S), a4 = adjust(p.set3, S.r3, S.pct, S.inc), nx = adjust(a4.weight, S.r4, S.pct, S.inc);
      const h = store.get(HKEY, []);
      h.push({ date: new Date().toLocaleDateString(), exercise: S.exercise || 'Exercise', unit: S.unit, pct: S.pct,
               set3: p.set3, r3: S.r3, set4: a4.weight, r4: S.r4, next: nx.weight });
      store.set(HKEY, h); S.saved = true; save(); render(); return;
    }
    if (act === 'new') {
      const p = plan(S), nx = adjust(adjust(p.set3, S.r3, S.pct, S.inc).weight, S.r4, S.pct, S.inc).weight;
      const keep = { exercise: S.exercise, unit: S.unit, pct: S.pct, inc: S.inc, rm: nx };
      S = Object.assign(fresh(), keep); return go(0);
    }
    if (act === 'print') return window.print();
    if (act === 'clear') { if (confirm('Delete all saved workouts on this device?')) { store.set(HKEY, []); render(); } return; }
  });

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { view = t.dataset.view; render(); }));

  /* ---------- Embedding support (WordPress iframe) ---------- */
  const embedded = window.self !== window.top;
  if (embedded || /[?&]embed=1/.test(location.search)) document.body.classList.add('embed');
  function notifyHeight() {
    if (!embedded) return;
    requestAnimationFrame(() => parent.postMessage({ type: 'impulse-apre10-height', height: document.documentElement.scrollHeight }, '*'));
  }
  function scrollParent() { if (embedded) parent.postMessage({ type: 'impulse-apre10-scrolltop' }, '*'); }
  if (embedded && 'ResizeObserver' in window) new ResizeObserver(notifyHeight).observe(document.body);

  // Expose pure logic for testing.
  window.APRE10 = { adjust, plan, tierFor, TIERS };
  render();
})();
</script>
</body>
</html>
